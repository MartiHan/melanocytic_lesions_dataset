<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Stlite app</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.89.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.89.1/build/stlite.js";

      mount(
        {
          archives: [
            {
              url: "./data.zip",
              format: "zip",
            },
          ],
          requirements: ["beautifulsoup4", "lxml", "streamlit-scroll-to-top"],
          entrypoint: "main.py",
          files: {
            "main.py": { url: "./main.py" },
            "highlight_component/__init__.py": {
              url: "./highlight_component/__init__.py",
            },
            "highlight_component/frontend/index.html": {
              url: "./highlight_component/frontend/index.html",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
