<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Highlight Component (Stable + Persistent)</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 0px;
      margin: 0;
    }

    #toolbar {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #toolbar label {
      font-weight: bold;
      font-size: 16px;
      margin-right: 8px;
    }

    button {
      padding: 6px 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #f8f9fa;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: #e9ecef;
      transform: scale(1.05);
    }

    /* Active button styles */
    #greenBtn.active {
      border-color: #28a745;
      background-color: #d4edda;
      box-shadow: 0 0 6px rgba(40, 167, 69, 0.4);
    }

    #yellowBtn.active {
      border-color: #ffc107;
      background-color: #fff3cd;
      box-shadow: 0 0 6px rgba(255, 193, 7, 0.4);
    }

    #redBtn.active {
      border-color: #dc3545;
      background-color: #f8d7da;
      box-shadow: 0 0 6px rgba(220, 53, 69, 0.4);
    }

    #removeBtn.active {
      border-color: #6c757d;
      background-color: #e2e3e5;
      box-shadow: 0 0 6px rgba(108, 117, 125, 0.4);
    }

    #text {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      white-space: pre-wrap;
      line-height: 1.5;
      user-select: text;
      font-size: 15px;
    }

    mark.green { background: #d1e7dd; }
    mark.yellow { background: #fff3cd; }
    mark.red { background: #f8d7da; }
  </style>
</head>
<body>
  <div id="text"></div>
  <div></div>
  <div id="toolbar">
    <button id="greenBtn" data-color="green">🟢 Enriching</button>
    <button id="yellowBtn" data-color="yellow">🟡 Irrelevant</button>
    <button id="redBtn" data-color="red">🔴 Factually wrong</button>
    <button id="removeBtn" data-color="remove">🧼 Erase</button>
  </div>

  <script>
    let currentColor = "yellow";
    let highlights = [];
    let basePlainText = "";
    const textDiv = document.getElementById("text");
    const toolbarButtons = document.querySelectorAll("#toolbar button");

    // === Toolbar color switching ===
    toolbarButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentColor = btn.dataset.color;
        toolbarButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
    document.getElementById("yellowBtn").classList.add("active");

    // === Highlight application logic ===
    function applyHighlight() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.toString().trim().length === 0) return;
      const range = sel.getRangeAt(0);
      if (!textDiv.contains(range.commonAncestorContainer)) return;

      // Compute text offsets
      const preRange = document.createRange();
      preRange.selectNodeContents(textDiv);
      preRange.setEnd(range.startContainer, range.startOffset);
      const start = preRange.toString().length;
      const end = start + range.toString().length;

      if (currentColor === "remove") {
        // Remove only overlapping segments
        highlights = subtractRange(highlights, start, end);
      } else {
        // keep unaffected parts, split overlaps, and insert new color
        highlights = applySmartHighlight(highlights, start, end, currentColor);
      }

      renderHighlights();
      postValue();
      sel.removeAllRanges();
    }

    /**
     * Remove overlap but preserve unaffected parts
     */
    function subtractRange(highs, start, end) {
      const newList = [];
      for (const h of highs) {
        if (h.end <= start || h.start >= end) {
          // no overlap
          newList.push(h);
        } else {
          // partial overlap — preserve left/right edges
          if (h.start < start) newList.push({ start: h.start, end: start, color: h.color });
          if (h.end > end) newList.push({ start: end, end: h.end, color: h.color });
        }
      }
      return newList;
    }

    /**
     * Insert a new highlight range, splitting and preserving existing ones
     */
    function applySmartHighlight(highs, start, end, color) {
      let result = [];
      for (const h of highs) {
        if (h.end <= start || h.start >= end) {
          // no overlap
          result.push(h);
        } else {
          // overlap -> keep non-overlapping parts
          if (h.start < start) result.push({ start: h.start, end: start, color: h.color });
          if (h.end > end) result.push({ start: end, end: h.end, color: h.color });
        }
      }
      // Add the new highlight
      result.push({ start, end, color });
      // Sort & merge adjacent segments of same color
      result.sort((a, b) => a.start - b.start);
      result = mergeAdjacent(result);
      return result;
    }

    function mergeAdjacent(list) {
      const merged = [];
      for (const h of list) {
        const last = merged[merged.length - 1];
        if (last && last.end === h.start && last.color === h.color) {
          last.end = h.end;
        } else {
          merged.push({ ...h });
        }
      }
      return merged;
    }

    function renderHighlights() {
      const text = basePlainText || textDiv.textContent || "";
      let html = "";
      let last = 0;
      const sorted = [...highlights].sort((a, b) => a.start - b.start);
      for (const h of sorted) {
        html += text.slice(last, h.start);
        html += `<mark class="${h.color}">${text.slice(h.start, h.end)}</mark>`;
        last = h.end;
      }
      html += text.slice(last);
      textDiv.innerHTML = html;
      setFrameHeight();
    }

    // Streamlit communication
    function postValue() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        apiVersion: 1,
        value: highlights
      }, "*");
    }

    function setFrameHeight() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        apiVersion: 1,
        height: document.body.scrollHeight
      }, "*");
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg.type === "streamlit:render") {
        // Load base text only once (so it doesn't re-nest)
        if (msg.args?.text && msg.args.text !== basePlainText) {
          basePlainText = msg.args.text;
          textDiv.textContent = basePlainText; // ✅ ensure base reset before highlight
        }
        highlights = msg.args?.highlights || [];
        renderHighlights();
      }
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");

    textDiv.addEventListener("mouseup", applyHighlight);
    new ResizeObserver(setFrameHeight).observe(document.body);
  </script>
</body>
</html>
